name: PR Full Debug Build

on:
  push:
    branches: ['ry/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [cmp-rewrite]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Build fullDebug APK
        env:
          # Nuvio's public client settings, published for third-party apps at nuvio.tv/docs/server-api.
          # A NUVIO_LOCAL_PROPERTIES_BASE64 secret, when present, takes precedence.
          NUVIO_SUPABASE_URL: https://api.nuvio.tv
          NUVIO_SUPABASE_ANON_KEY: sb_publishable_1Clq8rlTVACkdcZuqr6_AD__xUUC_EN
        run: |
          set -o pipefail
          # Fork-only diagnostics: stop after 30 min, dump threads of any stuck JVM, keep a plain log.
          ( sleep 1800; echo "=== TIMEOUT: thread dumps ==="; for p in $(pgrep -f java); do jcmd "$p" Thread.print 2>&1 | head -400; done; pkill -f GradleDaemon; pkill -f gradlew ) >> build-diag.log 2>&1 &
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publish build log to ry/ci-logs (fork only)
        if: always() && startsWith(github.ref, 'refs/heads/ry/')
        run: |
          mkdir -p /tmp/logs && tail -n 400 build.log > /tmp/logs/build-tail.log 2>/dev/null || true
          cp build-diag.log /tmp/logs/ 2>/dev/null || true
          grep -nE '^e: |error:|FAILURE|What went wrong' -A3 build.log | head -200 > /tmp/logs/errors.log 2>/dev/null || true
          cd /tmp/logs
          git init -q && git checkout -q -b ry/ci-logs
          git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "logs ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ry/ci-logs

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to a public download page (fork only)
        if: success() && github.repository == 'RzshStyle/NuvioMobile-Ry' && github.ref == 'refs/heads/ry/live-tv'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          cp "$APK" Nuvio-LiveTV.apk
          gh release delete live-tv-test --yes --cleanup-tag 2>/dev/null || true
          gh release create live-tv-test Nuvio-LiveTV.apk --prerelease --target "$GITHUB_SHA" \
            --title "Nuvio Live TV test build" \
            --notes "Test build from ry/live-tv (${GITHUB_SHA::7}). Download Nuvio-LiveTV.apk and install it."
